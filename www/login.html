<html>
<head>
    <title>Login - AsynapRous</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .login-container { max-width: 300px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #38488f; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="login-container">
    <h1>Login</h1>
    <form id="loginForm">
        Username: <input name="username" type="text" id="username" required><br>
        Password: <input name="password" type="password" id="password" required><br>
        <button type="submit">Login</button>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        // Prevent default HTML form submission behavior
        e.preventDefault(); 

        // Extract data from input fields
        const formData = new FormData(this);
        const jsonObject = {};
        formData.forEach((value, key) => {
            jsonObject[key] = value;
        });

        try {
            // Send request to the Backend API
            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(jsonObject)
            });

            // CRITICAL: Parse the JSON string returned from the Backend
            const data = await response.json();

            // Check the "status" field defined in our Python backend
            if (data.status === "ok") {
                // Save the username into the browser's session storage
                // This allows chat.html to retrieve it without prompting again
                sessionStorage.setItem('chatUser', jsonObject.username);
            
                // Redirect to the Chat page
                window.location.href = "/chat.html"; 
            } else {
                // Display error message if Python returns an error status
                alert("Login failed: " + data.message);
            }
        } catch (error) {
            console.error('Error:', error);
            alert("Network error occurred! Make sure the server is running.");
        }
    });
</script>

</body>
</html>
